<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root,
    change the href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/".
  -->

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">

  <meta
    content="IE=Edge"
    http-equiv="X-UA-Compatible"
  >

  <meta
    name="description"
    content="StructFlow - Construction Project Management System."
  >

  <!-- Google Maps JavaScript API -->
<!-- iOS meta tags & icons -->

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="StructFlow"
  >

  <link
    rel="apple-touch-icon"
    href="icons/Icon-192.png"
  >

  <!-- Favicon -->

  <link
    rel="icon"
    type="image/png"
    href="favicon.png"
  >

  <title>StructFlow</title>

  <link
    rel="manifest"
    href="manifest.json"
  >
</head>

<body>

  <!-- Flutter bootstrap -->

  <script
    src="flutter_bootstrap.js"
    async>
  </script>

</body>
</html>
