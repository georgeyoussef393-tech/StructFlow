name: structflow
description: StructFlow - Construction Project Management System
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0
  intl: ^0.20.2
  go_router: ^16.3.0
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.5.3
  geolocator: ^14.0.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/logo/