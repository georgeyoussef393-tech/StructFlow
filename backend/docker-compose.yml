services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: structflow
      POSTGRES_USER: structflow_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - structflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U structflow_admin -d structflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  structflow_postgres:
